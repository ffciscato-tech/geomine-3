<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title><!--GMPUB:TITULO--></title>
<style>
:root{--fundo:#eef2f6;--painel:#ffffff;--painel2:#f1f5f9;--linha:#cfd8e3;--tinta:#172433;--fraca:#5a6b7c;--forte:#0b1220;--destaque:#b3781a;--destaque-tinta:#1a1206;--azul:#1769c2;--sombra:0 6px 22px rgba(15,30,50,.16)}
body.escuro{--fundo:#0b1622;--painel:#0f2234;--painel2:#14293d;--linha:#29445b;--tinta:#e6eef6;--fraca:#a3b4c4;--forte:#ffffff;--destaque:#f3a51f;--destaque-tinta:#1a1206;--azul:#5aa9f0;--sombra:0 6px 22px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tinta);background:var(--fundo);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit}
#palco{position:fixed;inset:0 0 0 312px;touch-action:none}
#cena{display:block;width:100%;height:100%;outline:none;touch-action:none}
#painel{position:fixed;left:0;top:0;bottom:0;width:312px;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;background:var(--fundo);border-right:1px solid var(--linha);display:flex;flex-direction:column;gap:8px}
.cab{display:flex;gap:8px;align-items:flex-start}
.cab h1{font-size:16px;line-height:1.2;margin:0;color:var(--forte);overflow-wrap:anywhere}
.cab p{margin:2px 0 0;color:var(--fraca);font-size:12px;overflow-wrap:anywhere}
.cab .acoes{margin-left:auto;display:flex;gap:6px;flex:none}
.bt{border:1px solid var(--linha);background:var(--painel);border-radius:8px;padding:6px 10px;min-height:32px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.bt:hover{border-color:var(--fraca)}
.bt.on{background:var(--destaque);border-color:var(--destaque);color:var(--destaque-tinta);font-weight:600}
.bt.ic{width:32px;padding:0}
.card{background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:10px}
.card>h2{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13px;color:var(--forte)}
.card>h2>b{flex:none;width:20px;height:20px;border-radius:6px;background:var(--azul);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.card>h2>span.d{margin-left:auto;font-weight:400;color:var(--fraca);font-size:12px}
.lin{display:flex;align-items:center;gap:8px;min-height:30px}
.lin+.lin{border-top:1px solid var(--painel2)}
.lin input[type=checkbox]{width:18px;height:18px;margin:0;flex:none;accent-color:var(--azul)}
.lin label{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.lin label>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lin small{color:var(--fraca);flex:none}
.amostra{flex:none;width:18px;height:12px;border-radius:3px;border:1px solid var(--linha)}
.traco{flex:none;width:18px;height:0;border-top:3px solid #000}
.legenda{display:flex;flex-wrap:wrap;gap:4px 10px;padding:0 0 6px 26px;color:var(--fraca);font-size:12px}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.campo{display:flex;align-items:center;gap:8px;margin-top:8px}
.campo>span{color:var(--fraca);flex:1}
.campo select{border:1px solid var(--linha);background:var(--painel);border-radius:8px;padding:5px 8px;min-height:32px}
.dica{margin:8px 0 0;color:var(--fraca);font-size:12px;min-height:16px}
.dica b{color:var(--tinta)}
.med{border:1px solid var(--linha);border-radius:8px;padding:8px;margin-top:8px;background:var(--painel2)}
.med>h3{margin:0 0 6px;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--forte)}
.med>h3>i{flex:none;width:10px;height:10px;border-radius:50%}
.med>h3>button{margin-left:auto;border:0;background:none;color:var(--fraca);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.med .maior{font-size:17px;font-weight:700;color:var(--forte);line-height:1.15}
.med .maior small{font-size:12px;font-weight:400;color:var(--fraca)}
.med dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0}
.med dt{color:var(--fraca)}
.med dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.med dt.largo{grid-column:1/-1;margin-top:3px}
.med dd.largo{grid-column:1/-1;text-align:left;overflow-wrap:anywhere}
.med canvas{display:block;width:100%;height:124px;margin-top:6px;border-radius:6px;background:var(--painel)}
.med .obs{margin:6px 0 0;color:var(--fraca);font-size:11.5px}
.sobre{color:var(--fraca);font-size:12px}
.sobre dl{margin:0}
.sobre dt{overflow-wrap:anywhere}
.sobre dd{margin:0 0 5px;color:var(--tinta);overflow-wrap:anywhere}
.sobre p{margin:8px 0 0}
#bussola{position:absolute;right:12px;top:12px;width:46px;height:46px;border-radius:50%;background:var(--painel);border:1px solid var(--linha);box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center;cursor:pointer}
#bussola svg{width:34px;height:34px}
#leitura{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:5px 9px;box-shadow:var(--sombra);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#leitura:empty{display:none}
#aviso{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:min(520px,calc(100% - 90px));background:var(--painel);border:1px solid var(--destaque);border-radius:8px;padding:7px 12px;box-shadow:var(--sombra);text-align:center}
#aviso:empty{display:none}
#erro{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--fundo);z-index:9}
#erro.on{display:flex}
#erro div{max-width:420px}
#abre,#fecha{display:none}
@media (max-width:760px){
  #fecha{display:inline-flex}
  #palco{inset:0 0 0 0}
  #painel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:52vh;border-right:0;border-top:1px solid var(--linha);border-radius:14px 14px 0 0;box-shadow:var(--sombra);padding-bottom:max(10px,env(safe-area-inset-bottom))}
  body.recolhido #painel{display:none}
  #abre{display:inline-flex;position:fixed;right:12px;bottom:12px;z-index:5;box-shadow:var(--sombra)}
  body:not(.recolhido) #abre{display:none}
  body:not(.recolhido) #palco{bottom:52vh}
  #leitura{bottom:12px}
  body.recolhido #leitura{right:64px}
}
</style>
</head>
<body>
<div id="palco">
  <canvas id="cena" tabindex="0" aria-label="Vista 3D da publicação"></canvas>
  <div id="bussola" title="Norte para cima" role="button" aria-label="Girar a vista para o norte ficar em cima">
    <svg viewBox="0 0 34 34" aria-hidden="true"><g id="agulha"><path d="M17 3 23 19H11Z" fill="#d23b3b"/><path d="M17 31 23 19H11Z" fill="#8a97a6"/><text x="17" y="14.5" text-anchor="middle" font-size="8" font-weight="700" fill="#fff" font-family="system-ui,Arial,sans-serif">N</text></g></svg>
  </div>
  <div id="leitura"></div>
  <div id="aviso"></div>
</div>
<aside id="painel" aria-label="Painel da publicação">
  <div class="cab">
    <div><h1 id="titulo"></h1><p id="subtitulo"></p></div>
    <div class="acoes">
      <button class="bt ic" id="tema" title="Tema claro ou escuro" aria-label="Trocar entre tema claro e escuro"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg></button>
      <button class="bt ic" id="fecha" title="Recolher o painel" aria-label="Recolher o painel">▾</button>
    </div>
  </div>
  <section class="card" id="cardCamadas"><h2><b>1</b>Camadas</h2><div id="camadas"></div></section>
  <section class="card" id="cardVista"><h2><b>2</b>Vista</h2>
    <div class="g3"><button class="bt" data-vista="3d">3D</button><button class="bt" data-vista="planta">Planta</button><button class="bt" data-vista="tudo">Enquadrar</button></div>
    <label class="campo"><span>Exagero vertical</span><select id="exagero"><option value="1">1× (real)</option><option value="1.5">1,5×</option><option value="2">2×</option><option value="3">3×</option></select></label>
  </section>
  <section class="card" id="cardMedidas"><h2><b>3</b>Medidas de inclinação<span class="d" id="celula"></span></h2>
    <div class="g3"><button class="bt" data-med="dois" title="Inclinação da reta entre dois pontos">2 pontos</button><button class="bt" data-med="ponto" title="Inclinação do terreno num ponto">No ponto</button><button class="bt" data-med="perfil" title="Perfil do terreno entre dois pontos">Perfil</button></div>
    <p class="dica" id="dica"></p>
    <div id="medidas"></div>
    <div class="lin" id="limpaLinha" style="display:none;margin-top:8px"><button class="bt" id="limpa" style="flex:1">Limpar medidas</button></div>
  </section>
  <section class="card sobre" id="cardSobre"><h2><b>4</b>Sobre esta publicação</h2><dl id="sobre"></dl><p id="rodape"></p></section>
</aside>
<button class="bt" id="abre" aria-label="Abrir o painel">☰ Painel</button>
<div id="erro"><div><h2 id="erroTitulo">Não foi possível abrir a vista 3D</h2><p id="erroTexto"></p></div></div>
<!--GMPUB:DADOS-->
<!--GMPUB:SCRIPTS-->
</body>
</html>
