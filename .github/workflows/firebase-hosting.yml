# Publica o GeoMine no Firebase Hosting (projeto geomine-3).
#
# Requisito único: o segredo FIREBASE_SERVICE_ACCOUNT_GEOMINE_3 no repositório
# (Settings → Secrets and variables → Actions), contendo o JSON de uma conta de
# serviço do projeto geomine-3 com o papel "Firebase Hosting Admin".
# Gere com: firebase init hosting:github  (ou no console do Google Cloud, IAM → Contas de serviço).
#
# - push na branch main: deploy no canal live (https://geomine-3.web.app)
# - pull request: deploy num canal de prévia temporário, com o link comentado no PR
# - execução manual (workflow_dispatch): deploy no canal live a partir da branch escolhida

name: Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Montar dist/GeoMine.html
        run: python3 tools/build.py

      - name: Gerar public/ (versão web autenticada)
        run: python3 tools/publicar_web.py --config web/firebase-config.json

      - name: Validar contratos de colaboração
        run: |
          node tools/validate_collaboration_core.mjs
          node tools/validate_collaboration_firebase_contract.mjs

      - name: Deploy (prévia em PR, live em push/manual)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEOMINE_3 }}
          projectId: geomine-3
          channelId: ${{ github.event_name == 'pull_request' && '' || 'live' }}
