<main>
  <header id="ccmgisV74Toolbar" aria-label="Ferramentas da cava e do DCE">
    <label id="ccmgisMdtCommand" class="ccmgis-mdt-command" title="Escolher MDT de trabalho" aria-label="Escolher MDT de trabalho" data-tooltip="Escolher MDT de trabalho">
      <select id="ccmgis_mdt" aria-label="Escolher MDT de trabalho"><option value="">Escolher MDT de trabalho</option></select>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="soft" d="m3 17 5-9 4 5 4-8 5 12Z"/><path d="m3 17 5-9 4 5 4-8 5 12M3 20h18"/><path d="m18 3 2 2 2-2"/></svg>
    </label>
    <label id="ccmgisCotaCommand" class="ccmgis-cota-command" title="Cota de trabalho" aria-label="Cota de trabalho" hidden>
      <span class="ccmgis-cota-caption">Cota</span>
      <span id="ccmgis_cota_min" class="ccmgis-cota-bound" aria-label="Cota mínima">—</span>
      <input id="ccmgis_cota_trabalho" type="range" min="0" max="0" step="5" value="0" disabled aria-label="Cota de trabalho em intervalos de 5 metros">
      <output id="ccmgis_cota_valor" for="ccmgis_cota_trabalho" aria-live="polite">—</output>
      <span id="ccmgis_cota_max" class="ccmgis-cota-bound" aria-label="Cota máxima">—</span>
    </label>

    <span class="ccmgis-tool-sep" aria-hidden="true"></span>

    <button type="button" id="t_mover" class="ccmgis-tool" title="Mover" aria-label="Mover" data-tooltip="Mover">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12V7.5a1.5 1.5 0 0 1 3 0V11 5.5a1.5 1.5 0 0 1 3 0V11 6.5a1.5 1.5 0 0 1 3 0V12 9a1.5 1.5 0 0 1 3 0v5c0 4.5-2.7 7-7 7-3.1 0-4.7-1.7-6.5-4.5L4 14.3A1.6 1.6 0 0 1 6.4 12l.6.5Z"/><path class="soft" d="M7 12V7.5a1.5 1.5 0 0 1 3 0V11 5.5a1.5 1.5 0 0 1 3 0V11 6.5a1.5 1.5 0 0 1 3 0V12 9a1.5 1.5 0 0 1 3 0v5c0 4.5-2.7 7-7 7-3.1 0-4.7-1.7-6.5-4.5L4 14.3A1.6 1.6 0 0 1 6.4 12l.6.5Z"/></svg>
    </button>
    <button type="button" id="t_cava" class="ccmgis-tool" title="Desenhar cava" aria-label="Desenhar cava" data-tooltip="Desenhar cava">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="soft" d="M3 5h18l-3 4H6l3 4h6l-2 6h-2l-2-6-3-4Z"/><path d="M3 5h18M6 9h12M9 13h6M11 19h2"/><path d="m18 16 3 3m0-3-3 3"/></svg>
    </button>
    <button type="button" id="t_pilha" class="ccmgis-tool" title="Desenhar DCE" aria-label="Desenhar DCE" data-tooltip="Desenhar DCE">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="soft" d="M3 20h18l-3-4H6l3-4h6l-2-7h-2l-2 7-3 4Z"/><path d="M3 20h18M6 16h12M9 12h6M11 5h2"/><path d="m18 7 3-3m-3 0 3 3"/></svg>
    </button>
    <button type="button" id="t_editar" class="ccmgis-tool" title="Editar vértices" aria-label="Editar vértices" data-tooltip="Editar vértices">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 17 4-10 9-3 3 12-9 5z"/><rect x="2.5" y="15.5" width="3" height="3" class="solid"/><rect x="6.5" y="5.5" width="3" height="3" class="solid"/><rect x="15.5" y="2.5" width="3" height="3" class="solid"/></svg>
    </button>
    <button type="button" id="b_escolher" class="ccmgis-tool" title="Escolher linha existente" aria-label="Escolher linha existente" data-tooltip="Escolher linha existente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17 9 8l6 5 5-8"/><circle cx="4" cy="17" r="2" class="solid"/><circle cx="15" cy="13" r="2"/><path d="M15 4v5m-2.5-2.5h5"/></svg>
    </button>

    <span class="ccmgis-tool-sep" aria-hidden="true"></span>

    <button type="button" id="t_rampa" class="ccmgis-tool" title="Início da rampa" aria-label="Início da rampa" data-tooltip="Início da rampa">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h5V9h6V4h5"/><path d="m17 2 3 2-3 2"/><circle cx="9" cy="18" r="2" class="solid"/></svg>
    </button>
    <button type="button" id="t_retorno" class="ccmgis-tool" title="Retorno da rampa" aria-label="Retorno da rampa" data-tooltip="Retorno da rampa">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="soft" d="M5 18h7a5 5 0 1 0 0-10H7v4l-4-4 4-4v3h5a6 6 0 1 1 0 12H5z"/><path d="M5 18h7a5 5 0 1 0 0-10H4m3-4L3 8l4 4"/><circle cx="5" cy="18" r="1.8" class="solid"/></svg>
    </button>
    <button type="button" id="t_secao" class="ccmgis-tool" title="Seção" aria-label="Seção" data-tooltip="Seção">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="soft" d="M4 19 12 5l8 14Z"/><path d="M4 19 12 5l8 14ZM8 16h8M10 12h4"/></svg>
    </button>
    <button type="button" id="b_parar" class="ccmgis-tool" title="Finalizar" aria-label="Finalizar" data-tooltip="Finalizar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 20h14"/><path class="soft" d="M5 17h14v3H5z"/></svg>
    </button>
    <button type="button" id="b_reverter" class="ccmgis-tool" title="Reverter string" aria-label="Reverter string" data-tooltip="Reverter string">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7H3V3M3 7a9 9 0 1 1-1 8"/><path d="m9 15 3-3 3 3"/></svg>
    </button>
    <button type="button" id="b_desfazer" class="ccmgis-tool" title="Desfazer (Ctrl+Z)" aria-label="Desfazer" data-tooltip="Desfazer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7-5 5 5 5"/><path d="M4 12h9a7 7 0 0 1 7 7"/></svg>
    </button>
    <button type="button" id="b_refazer" class="ccmgis-tool" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer" data-tooltip="Refazer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5"/><path d="M20 12h-9a7 7 0 0 0-7 7"/></svg>
    </button>
    <button type="button" id="b_limpar" class="ccmgis-tool ccmgis-clear-tool" title="Limpar tudo" aria-label="Limpar tudo" data-tooltip="Limpar tudo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3m-8 0 1 14h8l1-14M10 11v6m4-6v6"/></svg>
    </button>
    <label class="ccmgis-toggle" title="Limites em preto" aria-label="Limites em preto" data-tooltip="Limites em preto">
      <input id="chk_lim_preto" type="checkbox" checked aria-label="Limites em preto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="soft" d="m4 15 3-9 9-2 4 8-5 8-8-1z"/><path d="m4 15 3-9 9-2 4 8-5 8-8-1z" stroke-width="2.2"/></svg>
    </label>

    <div class="sep"></div>

    <button type="button" id="b_ajustar" class="ccmgis-tool" title="Ajustar vista" aria-label="Ajustar vista" data-tooltip="Ajustar vista">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/><path d="m3 8 6-6m12 6-6-6M3 16l6 6m12-6-6 6"/></svg>
    </button>
    <button type="button" id="b_dxf" class="ccmgis-tool" title="Exportar DXF" aria-label="Exportar DXF" data-tooltip="Exportar DXF">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="soft" d="M6 3h9l4 4v14H6z"/><path d="M6 3h9l4 4v14H6zM15 3v5h5"/><text x="8" y="17" class="icon-text">DXF</text></svg>
    </button>
    <button type="button" id="b_png" class="ccmgis-tool" title="Exportar PNG" aria-label="Exportar PNG" data-tooltip="Exportar PNG">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="1.5" class="solid"/><path class="soft" d="m4 18 5-5 3 3 3-4 5 6z"/><path d="m4 18 5-5 3 3 3-4 5 6"/></svg>
    </button>
    <button type="button" id="ccmgis_cortar_cava" class="ccmgis-tool ccmgis-cut-tool" title="Cortar cava" aria-label="Cortar cava" data-tooltip="Cortar cava">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="soft" d="M3 6h18l-3 4H6l3 4h6l-2 6h-2l-2-6-3-4Z"/><path d="M3 6h18M6 10h12M9 14h6M11 20h2"/><path d="m5 4 14 17" stroke-dasharray="2.5 2"/></svg>
    </button>

    <span class="ccmgis-retired-controls" hidden aria-hidden="true">
      <button type="button" id="b_novo_lim" tabindex="-1">Novo limite (desenhar)</button>
      <select id="sel_como" tabindex="-1"><option value="crista">CRISTA</option><option value="pe">PÉ</option></select>
      <button type="button" id="b_diag" tabindex="-1">Diagnóstico</button>
      <button type="button" id="b_exemplo" tabindex="-1">Exemplo</button>
    </span>
  </header>
