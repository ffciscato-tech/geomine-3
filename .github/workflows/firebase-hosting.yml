# Publica o GeoMine no Firebase Hosting (projeto geomine-3).
#
# Requisito único: o segredo FIREBASE_SERVICE_ACCOUNT_GEOMINE_3 no repositório
# (Settings → Secrets and variables → Actions), com o conteúdo do JSON de uma
# conta de serviço do projeto (Console do Firebase → Configurações do projeto →
# Contas de serviço → Gerar nova chave privada).
#
# - push na branch main: publica no site no ar (https://geomine-3.web.app)
# - pull request: publica num canal de prévia temporário (link no resumo da execução)
# - execução manual (workflow_dispatch): publica no site no ar a partir da branch escolhida
#
# Sem o segredo, a montagem roda normalmente e a publicação é apenas pulada.

name: Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEOMINE_3 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Montar dist/GeoMine.html
        run: python3 -I -X utf8 tools/build.py

      - name: Gerar public/index.html (com portão de login)
        run: python3 -I -X utf8 tools/preparar_hosting.py

      - name: Registrar os SHA-256 gerados
        run: sha256sum dist/GeoMine.html public/index.html | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar (prévia em PR, site no ar em push/manual)
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::Segredo FIREBASE_SERVICE_ACCOUNT_GEOMINE_3 ausente; publicação pulada."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 -I -X utf8 tools/publicar_firebase.py --canal "pr-${{ github.event.number }}" \
              --expira 604800s --mensagem "PR #${{ github.event.number }} (${{ github.sha }})" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 -I -X utf8 tools/publicar_firebase.py --live \
              --mensagem "GitHub ${{ github.ref_name }} ${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
